name: AAT YouTube Approval Check

on:
  schedule:
    # Every 30 minutes from 7am to 11pm Lagos time so late Approve/Reject taps or /youtube codes are picked up fast.
    - cron: '*/30 6-22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: aat-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Dependencies
        run: python -m pip install --upgrade pip && pip install httpx pydantic pydantic-settings rich pynacl
      - name: Check Telegram and upload YouTube Short if approved
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          YOUTUBE_REDIRECT_URI: https://yomide01.github.io/callback
          PYTHONPATH: .
        run: python scripts/watch_approval.py
